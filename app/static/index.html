<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obsidian 个人知识库</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", sans-serif; background: #f4f1ea; color: #20211f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top left, #fff 0, #f4f1ea 48%, #e8e1d5 100%); }
    main { width: min(920px, calc(100% - 32px)); margin: 48px auto; }
    header { margin-bottom: 28px; }
    .eyebrow { color: #755a35; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(34px, 6vw, 58px); font-weight: 600; }
    header p { max-width: 650px; color: #62645f; line-height: 1.7; }
    .panel { padding: 24px; border: 1px solid #d8d1c5; border-radius: 20px; background: rgba(255,255,255,.78); box-shadow: 0 18px 50px rgba(68,55,37,.08); }
    .query { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; }
    input { width: 100%; min-width: 0; padding: 13px 15px; border: 1px solid #c9c1b5; border-radius: 10px; background: #fff; font-size: 16px; }
    button { padding: 12px 18px; border: 0; border-radius: 10px; background: #20211f; color: #fff; font-weight: 700; cursor: pointer; }
    button.secondary { background: #8d6d43; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 22px; margin: 14px 2px 0; color: #6e706b; font-size: 14px; }
    #answer { display: none; margin-top: 20px; padding: 18px; border-left: 3px solid #8d6d43; background: #faf8f3; line-height: 1.75; white-space: pre-wrap; }
    #sources { display: grid; gap: 12px; margin-top: 20px; }
    .source { padding: 17px 18px; border: 1px solid #ddd6ca; border-radius: 14px; background: #fff; }
    .source h2 { margin: 0 0 5px; font-size: 17px; }
    .path { color: #777970; font-family: Consolas, monospace; font-size: 12px; }
    .excerpt { margin: 12px 0; color: #454743; line-height: 1.65; }
    .open { color: #765727; font-weight: 700; text-decoration: none; }
    .open:hover { text-decoration: underline; }
    @media (max-width: 680px) { .query { grid-template-columns: 1fr 1fr; } input { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Read only knowledge workspace</div>
      <h1>Obsidian 个人知识库</h1>
      <p>检索 Markdown、双向链接与标签。回答只提供建议，所有修改仍在 Obsidian 中完成。</p>
    </header>
    <section class="panel">
      <div class="query">
        <input id="query" placeholder="例如：为什么选择本地 Embedding？" aria-label="知识库问题">
        <button id="search">检索</button>
        <button id="ask" class="secondary">询问 Agent</button>
      </div>
      <div id="status" aria-live="polite"></div>
      <div id="answer"></div>
      <div id="sources"></div>
    </section>
  </main>
  <script>
    const query = document.querySelector("#query");
    const status = document.querySelector("#status");
    const answer = document.querySelector("#answer");
    const sources = document.querySelector("#sources");
    const buttons = [...document.querySelectorAll("button")];

    function setBusy(value, message = "") {
      buttons.forEach(button => button.disabled = value);
      status.textContent = message;
    }

    function renderSources(items) {
      sources.replaceChildren();
      for (const item of items) {
        const card = document.createElement("article");
        card.className = "source";
        const title = document.createElement("h2");
        title.textContent = item.title;
        const path = document.createElement("div");
        path.className = "path";
        path.textContent = item.relative_path;
        const excerpt = document.createElement("p");
        excerpt.className = "excerpt";
        excerpt.textContent = item.excerpt;
        const open = document.createElement("a");
        open.className = "open";
        open.textContent = "在 Obsidian 中打开";
        if (String(item.obsidian_uri).startsWith("obsidian://open?")) open.href = item.obsidian_uri;
        card.append(title, path, excerpt, open);
        sources.append(card);
      }
    }

    async function run(mode) {
      const text = query.value.trim();
      if (!text) return query.focus();
      setBusy(true, mode === "search" ? "正在检索…" : "Agent 正在核对来源…");
      answer.style.display = "none";
      try {
        const response = mode === "search"
          ? await fetch(`/v1/search?q=${encodeURIComponent(text)}&top_k=5`)
          : await fetch("/v1/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: text }) });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "请求失败");
        if (mode === "chat") {
          answer.textContent = body.answer;
          answer.style.display = "block";
        }
        renderSources(body.sources || []);
        status.textContent = `找到 ${(body.sources || []).length} 条来源`;
      } catch (error) {
        status.textContent = error.message;
        sources.replaceChildren();
      } finally {
        setBusy(false, status.textContent);
      }
    }

    document.querySelector("#search").addEventListener("click", () => run("search"));
    document.querySelector("#ask").addEventListener("click", () => run("chat"));
    query.addEventListener("keydown", event => { if (event.key === "Enter") run("search"); });
    fetch("/health").then(response => response.json()).then(body => {
      status.textContent = `${body.vault_name} · ${body.notes} 篇笔记 · ${body.index_ready ? "索引就绪" : "等待建索引"}`;
    }).catch(() => { status.textContent = "服务状态暂不可用"; });
  </script>
</body>
</html>
